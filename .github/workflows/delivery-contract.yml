name: Delivery Contract

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate fixed-SHA PR contract
    runs-on: [self-hosted, linux, x64, server229, personal-agent-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch untrusted head as data only
        env:
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$GH_HEAD_SHA"
      - name: Validate PR metadata and owned paths
        env:
          GH_PR_BODY: ${{ github.event.pull_request.body }}
          GH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node ops/github-delivery/validate.mjs
